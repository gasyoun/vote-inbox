name: tests

# The repo's only executable surface (relay/ + tools/) and its data contract
# (schema/decisions-pack.schema.json) had no CI home until 27-10-2026, which is why
# six of nine committed packs drifted away from the schema unnoticed
# (bughunt findings 3 and 6-class). This job is the gate that keeps the rest honest.
#
# The browser smokes (relay/smoke_relay.py, relay/smoke_hydrate.py) are NOT run here:
# they need playwright plus a live relay and a published sheet. Run them by hand —
# see relay/README.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Schema + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Byte-compile every script
        run: python -m py_compile relay/*.py tools/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate every committed decision pack
        run: python tools/validate_packs.py
