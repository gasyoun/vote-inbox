# H2991 — GitHub OAuth device-flow CORS relay.
# Included inside the kosha server{} block:
#   include /etc/nginx/snippets/gh-device-relay.conf;
#
# WHY THIS EXISTS (Uprava FINDINGS §477, measured 18-08-2026): GitHub sends no
# Access-Control-Allow-Origin on login/device/code or login/oauth/access_token,
# so a static vote sheet on gasyoun.github.io can SEND the device-code request
# and never READ the reply. api.github.com is fully CORS-enabled, so the vote
# hydrate and the inbox write already work from the page; only token
# acquisition needed this.
#
# WHAT IT IS NOT: it adds CORS headers and forwards. It holds no client_secret
# (the device flow has none), stores nothing, and logs no body. It is not an
# authorization bypass — anyone may POST these two endpoints directly with curl,
# which ignores CORS entirely; the only thing a browser lacked was permission to
# read a public response. Removing this relay breaks the button and nothing else.

location = /gh-device/code {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=gh_device burst=10 nodelay;

    if ($request_method = OPTIONS) { return 204; }

    proxy_pass                 https://github.com/login/device/code;
    proxy_http_version         1.1;
    proxy_set_header           Host github.com;
    proxy_set_header           Connection "";
    proxy_ssl_server_name      on;
    proxy_ssl_name             github.com;
    # GitHub's reply to a VALID client_id carries its whole header set (a ~4 KB
    # Content-Security-Policy among them) and overflows the 4k/8k default ->
    # 502 'upstream sent too big header'. The fake-id 404 fit, so this surfaced
    # only on the first real call. proxy_hide_header cannot help: the header must
    # be READ into the buffer before it can be hidden.
    proxy_buffer_size          32k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;
    # The client's own Origin/Referer must not ride along: GitHub has no use for
    # them here and they only widen what this hop tells a third party.
    proxy_set_header           Origin "";
    proxy_set_header           Referer "";
    proxy_hide_header          Access-Control-Allow-Origin;
    proxy_hide_header          Content-Security-Policy;
    proxy_hide_header          Set-Cookie;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    add_header Access-Control-Max-Age       86400 always;
    add_header Vary                         Origin always;
    # §476: an add_header inside a location DROPS every header inherited from
    # server{}, so the two the site sets globally are restated here on purpose.
    add_header X-Content-Type-Options       nosniff always;
    add_header X-Frame-Options              DENY always;
}

location = /gh-device/token {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=gh_device burst=20 nodelay;

    if ($request_method = OPTIONS) { return 204; }

    proxy_pass                 https://github.com/login/oauth/access_token;
    proxy_http_version         1.1;
    proxy_set_header           Host github.com;
    proxy_set_header           Connection "";
    proxy_ssl_server_name      on;
    proxy_ssl_name             github.com;
    # GitHub's reply to a VALID client_id carries its whole header set (a ~4 KB
    # Content-Security-Policy among them) and overflows the 4k/8k default ->
    # 502 'upstream sent too big header'. The fake-id 404 fit, so this surfaced
    # only on the first real call. proxy_hide_header cannot help: the header must
    # be READ into the buffer before it can be hidden.
    proxy_buffer_size          32k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;
    proxy_set_header           Origin "";
    proxy_set_header           Referer "";
    proxy_hide_header          Access-Control-Allow-Origin;
    proxy_hide_header          Content-Security-Policy;
    proxy_hide_header          Set-Cookie;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    add_header Access-Control-Max-Age       86400 always;
    add_header Vary                         Origin always;
    add_header X-Content-Type-Options       nosniff always;
    add_header X-Frame-Options              DENY always;
}
