# H2991 — allowed origins for the GitHub OAuth device-flow CORS relay.
# Ships in the http{} context: /etc/nginx/conf.d/gh-device-relay-map.conf
#
# An origin absent from this map gets an EMPTY $cors_origin, and nginx omits a
# header whose value is the empty string — so an unlisted page still cannot read
# the reply. That is the whole access control this relay has, and it is enough:
# see the note in gh-device-relay.conf about why the relay grants nothing that
# is not already public.
map $http_origin $cors_origin {
    default                                              "";
    "https://gasyoun.github.io"                          $http_origin;
    "~^http://(127\.0\.0\.1|localhost)(:[0-9]+)?$"        $http_origin;
}

# Politeness toward GitHub, not a security control: a browser doing one device
# login sends two requests plus a poll every 5 s.
limit_req_zone $binary_remote_addr zone=gh_device:1m rate=30r/m;
